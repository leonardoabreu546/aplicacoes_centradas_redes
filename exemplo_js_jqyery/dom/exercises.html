<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>repl.it</title>
    <link href="../style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <div class="menu" id="mainMenu">
      <ul>
        <li><a href="index.html" class="menu-item">GET </a></li>
        <li><a href="set.html" class="menu-item">SET </a></li>
        <li><a href="create.html" class="menu-item">Create / remove </a></li>
        <li><a href="classes.html" class="menu-item">Style classes </a></li>
        <li><a href="events.html" class="menu-item">Events </a></li>
        <li><a href="exercises.html" class="menu-item">Exercises </a></li>
        <li><a href="#" class="menu-item">DOM </a></li>
      </ul>
    </div>

    <h2 id="header">DOM Exercises </h2>

    <div class="spaced">
      <input type="text" id="name"/>
      <button id="btn1">Show .value in console!</button>
    </div>

    <div id="nameList" class="spaced">
      <input type="text" id="name2"/>
      <button id="btn2">Add to Names list</button>
      <h2 id="namesHeader">Names:
      </h2>
      <ul>
        <li>Gonçalo</li>
      </ul>
    </div>

    <span id="result">Result:</span> 
      <script>
        let names= document.getElementById("namesHeader");
        names.style.color = "blue";

        let menu = document.getElementById("mainMenu");
        menu.className = "menu-clear";

        let paragraph = document.createElement("p");
        paragraph.textContent = "This is a new paragraph created with JS!";
        document.body.appendChild(paragraph);

        let result = document.getElementById("result");
        let menuAnchors = document.querySelectorAll(".menu-item");
        menuAnchors.forEach(element => {
          result.appendChild(element);
        });

        let btn1 = document.getElementById("btn1");
        let textName = document.getElementById("name");
        btn1.addEventListener("click", function() {
          console.log(textName.value);
        });

        let btn2 = document.getElementById("btn2");
        let textName2 = document.getElementById("name2");
        let namesList = document.querySelector("#nameList > ul");
        btn2.addEventListener("click", function() {
          let newLi = document.createElement("li");
          newLi.textContent = textName2.value;
          namesList.appendChild(newLi);
        });

      </script>
      
    

  </body>
</html>
